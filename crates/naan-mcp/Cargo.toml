[package]
name = "naan-mcp"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "naan-mcp"
path = "src/main.rs"

[dependencies]
naan-core = { path = "../naan-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"

[dev-dependencies]
tempfile = "3"
serde_json = "1"
